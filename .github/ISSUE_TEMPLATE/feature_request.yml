name: Feature request
description: Propose a capability that fits PAR's scope.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PAR deliberately does not add a web GUI, an auto-supervisor, automatic application to real
        repositories, or a provider whose vendor terms forbid third-party wrapping. Read the
        non-goals in the product contract before opening a large proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should PAR do, and which role/route does it belong to?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kernel / task state
        - Approvals / coordinator lease
        - MCP bridge
        - Native adapter
        - Manual hand-off
        - Docs / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: What can it execute, write or expose? Which permission boundary changes?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
