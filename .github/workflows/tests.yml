name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Two levels, deliberately separate and named so neither reads as "the full suite":
  #   smoke_install  - the package installs and its own CLI runs.
  #   core_unittests - the state, store, contract, approval and policy regressions that a real
  #                    defect (Issue #1 was one) would trip. Scripted fake workers only: no vendor
  #                    binary, no network, no real model call.
  # The rest of the suite still runs only on a developer's Mac: several tests assume a
  # single-user macOS machine (the real Codex/Antigravity adapters correctly refuse GitHub's
  # group-writable Python; others assume macOS-specific doctor checks or a larger ARG_MAX).
  # Loosening any of those would be a safety-relevant change needing mutation_check.py coverage,
  # not something to do to turn a badge green.
  smoke_install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: par doctor
      - run: par version

  # T15: the pure-logic security core is platform independent. Linux CI runs the same negative
  # cases (path escape, contract allowlists, redaction, sensitive names, unknown vendor events)
  # so a platform difference cannot silently skip a security behaviour.
  # linux_process_control below runs the scripted-worker cancellation/timeout module on the real
  # Linux signal/process-group behaviour instead of leaving it macOS-only.
  linux_security_core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: par doctor            # reports WARN for an untested platform; must still exit 0
      - run: par version
      - name: Platform-independent security regressions
        run: >-
          python -B -m unittest
          tests.unit.test_states
          tests.unit.test_contract
          tests.unit.test_policy
          tests.unit.test_redact
          tests.unit.test_paths
          tests.unit.test_provider_probe
          tests.unit.test_p3_security_audit
          tests.unit.test_approval_grants
          tests.unit.test_authorization_lease
          tests.unit.test_config_inspection
          tests.unit.test_cli_copilot
          tests.unit.test_acceptance_matrix
      - name: Documentation contract, relative links and CLI examples
        run: |
          python -B tests/tools/link_check.py
          python -B tests/tools/docs_contract.py
          python -B tests/tools/docs_cli_examples.py

  # The cancellation/timeout paths depend on POSIX signals and process groups, which is exactly
  # where a platform drift hides. Scripted fake workers only: no vendor binary, no model call.
  # test_subprocesses stays on a developer machine: one case feeds a synthetic event stream through
  # argv to prove bounded retention, and Linux's per-argument limit (E2BIG) is smaller than macOS's.
  # That is an ARG_MAX assumption, not a process-control behaviour; the modules below cover the
  # cancellation, timeout, process-group and orphan-recovery semantics.
  linux_process_control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Cancellation, timeout and process-group regressions
        run: >-
          python -B -m unittest
          tests.unit.test_kernel_control
          tests.unit.test_validation_results
          tests.unit.test_kernel_recovery

  core_unittests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: State, approval, contract, policy, hand-off and integration regressions
        run: >-
          python -B -m unittest
          tests.unit.test_states
          tests.unit.test_store
          tests.unit.test_contract
          tests.unit.test_kernel_control
          tests.unit.test_kernel_submit
          tests.unit.test_kernel_policy
          tests.unit.test_context_interface
          tests.unit.test_generic_project
          tests.unit.test_p1_compat
          tests.unit.test_task_draft
          tests.unit.test_mcp_prepare
          tests.unit.test_manual_handoff
          tests.unit.test_evidence_summary
          tests.unit.test_candidate_integration
          tests.unit.test_role_provider_caps
          tests.unit.test_provider_probe
          tests.unit.test_p3_security_audit
          tests.unit.test_example_project
          tests.unit.test_approval_grants
          tests.unit.test_authorization_lease
          tests.unit.test_config_inspection
          tests.unit.test_cli_copilot
          tests.unit.test_acceptance_matrix
