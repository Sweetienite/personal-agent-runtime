[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-runtime"
description = "Local task runtime for coordinating CLI coding agents: a Kernel with an append-only SQLite ledger, private per-attempt clones, approval-gated writes and Kernel-run verification; Codex and Antigravity adapters plus a manual hand-off path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
dynamic = ["version"]

[project.scripts]
par = "par.cli:main"

[tool.setuptools.dynamic]
version = { attr = "par.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
par = ["schemas/*.json"]
